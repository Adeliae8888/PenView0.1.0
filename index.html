<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#05090f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>PenView</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="mode-nav">
  <div id="banner" class="banner hidden" role="alert"></div>

  <svg id="map" class="map" aria-label="地図">
    <g id="geo"></g>
    <g id="overlay"></g>
  </svg>

  <header class="topbar">
    <div class="brand">PENVIEW</div>
    <div class="seg" role="tablist" aria-label="モード">
      <button type="button" data-mode="NAV" role="tab">NAV</button>
      <button type="button" data-mode="TAC" role="tab">TAC</button>
    </div>
    <button type="button" id="gpsPill" class="pill" title="GPS">GPS OFF</button>
    <div class="spacer"></div>
    <button type="button" id="coordBtn" class="btn" title="座標形式">DDM</button>
    <button type="button" id="settingsBtn" class="btn" aria-label="設定">設定</button>
  </header>

  <section id="dataPanel" class="data-panel" aria-live="polite"></section>

  <nav class="map-ctrl">
    <button type="button" id="zoomIn" class="btn round" aria-label="拡大">＋</button>
    <button type="button" id="zoomOut" class="btn round" aria-label="縮小">－</button>
    <button type="button" id="followBtn" class="btn round" aria-label="自機を中央に固定して Heading-up">◎</button>
    <button type="button" id="gridBtn" class="btn round" aria-label="グリッド表示">#</button>
  </nav>

  <div class="scale"><div id="scaleBar" class="scale-bar"></div><span id="scaleLabel"></span></div>
  <div id="northArrow" class="north-arrow hidden">N</div>
  <div id="cursorReadout" class="cursor-readout hidden" aria-label="カーソル位置の座標"></div>
  <div class="credit">© OpenAIP (CC BY-NC) · Natural Earth</div>

  <aside id="infoSheet" class="sheet info" aria-label="地点情報"></aside>

  <aside id="settingsSheet" class="sheet settings" aria-label="設定">
    <div class="sheet-head"><h2>設定</h2><button type="button" class="btn" data-close="settingsSheet">閉じる</button></div>

    <section class="group">
      <h3>自機位置</h3>
      <div class="row">
        <button type="button" id="gpsToggle" class="btn primary">GPS 受信開始</button>
        <span id="gpsDetail" class="muted"></span>
      </div>
      <div class="row wrap">
        <label>TRK°M <input id="simTrk" type="number" min="0" max="359" step="1" value="090" inputmode="numeric" /></label>
        <label>GS kt <input id="simGs" type="number" min="0" max="1200" step="10" value="420" inputmode="numeric" /></label>
        <label>ALT ft <input id="simAlt" type="number" min="0" max="60000" step="500" value="20000" inputmode="numeric" /></label>
        <button type="button" id="simToggle" class="btn">模擬飛行 開始</button>
      </div>
      <p class="muted">模擬飛行は地図中心（または自機位置）から開始します。PC での確認用。</p>
    </section>

    <section class="group">
      <h3>ブルズアイ</h3>
      <div class="row wrap">
        <label class="grow">位置 <input id="bullInput" type="text" placeholder="N3620.844 E14122.459 / MGRS" autocomplete="off" /></label>
        <label>名称 <input id="bullName" type="text" maxlength="12" /></label>
        <button type="button" id="bullApply" class="btn primary">設定</button>
      </div>
      <p id="bullStatus" class="muted"></p>
    </section>

    <section class="group">
      <h3>磁気偏差</h3>
      <div class="row wrap">
        <label><input type="radio" name="varMode" value="auto" /> 自動（国土地理院 2020.0）</label>
        <label><input type="radio" name="varMode" value="manual" /> 手動</label>
        <label>手動値 <input id="manualVar" type="number" step="0.1" min="-30" max="30" placeholder="W=-8" /></label>
      </div>
      <p id="varStatus" class="muted"></p>
    </section>

    <section class="group">
      <h3>座標へ移動</h3>
      <div class="row">
        <input id="gotoInput" class="grow" type="text" placeholder="DDM / DMS / DD / MGRS / B/E 045/30" autocomplete="off" />
        <button type="button" id="gotoBtn" class="btn">移動</button>
      </div>
      <p id="gotoStatus" class="muted"></p>
    </section>

    <section class="group">
      <h3>レイヤー</h3>
      <div id="layerToggles" class="chips"></div>
      <h3>空域の種類</h3>
      <div id="airspaceToggles" class="chips"></div>
    </section>

    <section class="group">
      <p id="aboutText" class="muted"></p>
    </section>
  </aside>

  <script src="version.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
